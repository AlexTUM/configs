[Appearance]
color_scheme_path=$HOME/.config/qt5ct/colors/catppuccin-macchiato-mauve.conf
custom_palette=true
icon_theme=Tokyonight-Dark
standard_dialogs=default
style=kvantum

[Fonts]
fixed="DejaVuSansM Nerd Font,12,-1,5,57,0,0,0,0,0,Regular"
general="DejaVuSansM Nerd Font,14,-1,5,57,0,0,0,0,0,Regular"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=General, AnimateMenu, AnimateCombo, AnimateTooltip, AnimateToolBox
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[PaletteEditor]
geometry=@ByteArray(\x1\xd9\xd0\xcb\0\x3\0\0\xff\xff\xf8\x80\0\0\0\0\xff\xff\xfd\xbf\0\0\x2\xf3\xff\xff\xf8\x80\0\0\0\0\xff\xff\xfa\xf6\0\0\x2\x10\0\0\0\0\x2\0\0\0\a\x80\xff\xff\xf8\x80\0\0\0\0\xff\xff\xfd\xbf\0\0\x2\xf3)

[SettingsWindow]
geometry=@ByteArray(\x1\xd9\xd0\xcb\0\x3\0\0\xff\xff\xf8\x80\0\0\0\0\xff\xff\xfd\xbf\0\0\x2\xf3\xff\xff\xf8\x80\0\0\0\0\xff\xff\xfb\xe3\0\0\x2\x1e\0\0\0\0\x2\0\0\0\a\x80\xff\xff\xf8\x80\0\0\0\0\xff\xff\xfd\xbf\0\0\x2\xf3)

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()
