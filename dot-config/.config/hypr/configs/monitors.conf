# Monitor Configuration
# https://wiki.hyprland.org/Configuring/Monitors/
# `hyprctl monitors` to get the info.

# Monitors
monitorv2 {
  output = DP-2
  mode = 2560x1440@99.95
  position = 0x0
  scale = 1
  #bitdepth = 10
  #cm = hdr
  #sdrbrightness = 1.2
}

monitorv2 {
  output = HDMI-A-1
  mode = 1920x1080@60
  position = auto-left
  scale = 0.75
}

# Plugin additional monitors
monitor=, preferred, auto-right, 1

# QEMU-KVM, virtual box or vmware
# monitor = Virtual-1, 1920x1080@60,auto,1

# mirror main monitor samples
# monitor=,preferred,auto,1,mirror,DP-1
