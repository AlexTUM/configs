# https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf

$scriptsDir = $HOME/.config/hypr/scripts

dwindle {
  preserve_split = true
  smart_resizing = true 
  use_active_for_splits = true 
  smart_split = false
  default_split_ratio = 1.0
  split_bias = 0
  precise_mouse_move = false
  special_scale_factor = 0.8
}

master {
  new_status = slave
  new_on_top =  true
  new_on_active = none
  orientation = left
  mfact = 0.55
  smart_resizing = false
  drop_at_cursor = true
  always_keep_position = false
}

scrolling {
    # Default width of new windows (0.1 - 1.0)
    column_width = 0.80
    # If only one window is open, should it span the whole screen?
    fullscreen_on_one_column = true
    # Direction: right, left, up, or down
    direction = right
    # Center the focused window automatically
    follow_focus = true
}
monocle {
  # I can't find any settings on the wiki
}

general {
  resize_on_border = true
  layout = master 
}

input {
  kb_layout = de
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300
  sensitivity = 0 #mouse sensitivity
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = true 
    clickfinger_behavior = false
    middle_button_emulation = false
    tap-to-click = true
    drag_lock = false
  }
}

gestures {
  workspace_swipe_distance = 300
  workspace_swipe_touch = false
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_create_new = true
  workspace_swipe_direction_lock = true
  workspace_swipe_forever = false
  workspace_swipe_use_r = false
  close_max_timeout = 100

  gesture = 3, horizontal, workspace
  gesture = 3, up, dispatcher, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.5}')"
  gesture = 3, down, dispatcher, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.5}')" 
  gesture = 4, up, dispatcher, exec, $scriptsDir/OverviewToggle.sh 
  gesture = 4, down, float
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true # splash screen on startup
  vrr = 2      # adaptive sync; 2: fullscreen only
  mouse_move_enables_dpms = true  # dpms: control monitor power states
  enable_swallow = false          # terminal-launched GUI programs replace the terminal window
  swallow_regex = ^(kitty)$
  focus_on_activate = false   # whether to focus apps that request focus
  initial_workspace_tracking = 0  # windows will open on the workspace they were invoked on; 0: disabled
  middle_click_paste = true
  enable_anr_dialog = true    # Application not Responding (ANR)
  anr_missed_pings = 15       # ANR Threshold default 1 is too low
  allow_session_lock_restore = true  # Prevent lockscreen crash when resume from suspend
  on_focus_under_fullscreen = 1
  # 0 - Default, no change
  # 1 - New focused window takes over fullscreen (Windows-like Alt-Tab)
  # 2 - New focused window stays behind the fullscreen one
}

#opengl {
#  nvidia_anti_flicker = true
#}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = false
  pass_mouse_when_bound = false
  workspace_center_on = 1
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}

render {
  direct_scanout = 0
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors =  1 # change to 1 if want to disable
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  no_warps = true 
  no_break_fs_vrr = false
	min_refresh_rate = 24
	hotspot_padding  = 1
	inactive_timeout = 0
  default_monitor  = DP-2
	zoom_factor = 1.0
	zoom_rigid = false
	zoom_detached_camera = true
	hide_on_key_press = true
	hide_on_touch  = false
	use_cpu_buffer = 2 
}

ecosystem {
   no_donation_nag = true
}
