source = $HOME/.config/hypr/macchiato.conf # catppuccin colors
$Scripts = $HOME/.config/hypr/scripts

$accent = $mauve
$accentAlpha = $mauveAlpha
$baseFont = DejaVuSansM Nerd Font Propo
$lightFont = DejaVu Sans Light

general {
    grace = 60
    hide_cursor = true
    ignore_empty_input = true
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    #path = screenshot   # screenshot of your desktop
    path = $HOME/.config/hypr/wallpaper/.current # current wallpaper
    
    color = $base

    blur_size = 3
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $text
    font_size = 64
    font_family = $baseFont

    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_boost = 1.3
    shadow_color = $accent
}

# Hour-Time (single horizontal time like 1080p variant)
label {
    monitor =
    # text = cmd[update:1000] echo "$(date +"%H:%M")"   # 24h option
    # text = cmd[update:1000] echo "$(date +"%I:%M %p")" # AM/PM
	#color = rgba(255, 185, 0, .8)
    text = $TIME
    color = $text
    font_size = 173
    font_family = $baseFont Bold 
    position = 0, -133
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 6
    shadow_boost = 1.3
    shadow_color = $accent
}

