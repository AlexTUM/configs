# USER
label {
    monitor = DP-2
    text =   $USER
    color = $text
    font_size = 48
    font_family = $baseFont
    position = 0, 300
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor = DP-2
    size = 306, 93
    outline_thickness = 4
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    capslock_color = $yellow
    check_color = $accent
    fail_color = $red
    font_color = $text
    fade_on_empty = false
    font_family = $baseFont
    placeholder_text = <i><span foreground="##ffffff99">🔒Password</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor = DP-2
    text = $LAYOUT
    color = $subtext1
    font_size = 19
    font_family = $lightFont
    position = 0, 53
    halign = center
    valign = bottom
}

# uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p)" </b>"
    color = $subtext1
    font_size = 19
    font_family = $lightFont
    position = 0, 0
    halign = right
    valign = bottom
}

